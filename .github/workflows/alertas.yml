name: Alertas de tempestade

on:
  schedule:
    # O GitHub pode atrasar ou descartar execuções: duas por hora, fora dos minutos mais cheios
    - cron: "23 * * * *"
    - cron: "53 * * * *"
    - cron: "7 12 * * 0" # teste semanal: domingo, 9h07 em Brasília
  workflow_dispatch:
    inputs:
      teste:
        description: Mandar só uma notificação de teste
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alertas

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # O estado fica em um ramo separado para não republicar o site a cada alerta
      - uses: actions/checkout@v4
        with:
          ref: alertas-estado
          path: estado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r alertas/requirements.txt
      - name: Verificar previsão
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          TESTE: ${{ inputs.teste || github.event.schedule == '7 12 * * 0' }}
        run: python alertas/verificar.py estado/estado.json
      - name: Guardar estado
        if: always()
        working-directory: estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git diff --cached --quiet || { git commit -qm "Atualiza estado dos alertas"; git push -q; }
